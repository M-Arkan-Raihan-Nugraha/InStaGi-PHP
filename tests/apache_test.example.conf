# Contoh konfigurasi Apache untuk MENGUJI .htaccess proyek InStaGi apa adanya.
# -----------------------------------------------------------------------------
# Gunanya: server bawaan PHP (`php -S`) tidak membaca .htaccess, jadi aturan
# "alamat rapi" (bagian 0d) sebaiknya sekali waktu diuji dengan Apache asli.
#
# Pakai (Windows + XAMPP):
#   <xampp>/apache/bin/httpd.exe -f "docs/uji/apache-uji.example.conf" -t   # cek sintaks
#   <xampp>/apache/bin/httpd.exe -f "docs/uji/apache-uji.example.conf"
# lalu uji dengan header X-Forwarded-Proto agar aturan paksa-HTTPS dilewati:
#   curl -s -H "X-Forwarded-Proto: https" -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/imt
#
# Sesuaikan DUA bagian di bawah dengan letak XAMPP dan letak proyek Anda.
# Ini BUKAN konfigurasi produksi — hanya untuk mesin pengembang, dan memakai
# database UJI (bukan produksi).

ServerName localhost
Listen 127.0.0.1:8080

# [1/2] Letak XAMPP
ServerRoot "D:/SMAKZIE/PRODUKTIF/XAMPP/apache"

LoadModule alias_module      "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/modules/mod_alias.so"
LoadModule authz_core_module "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/modules/mod_authz_core.so"
LoadModule dir_module        "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/modules/mod_dir.so"
LoadModule log_config_module "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/modules/mod_log_config.so"
LoadModule mime_module       "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/modules/mod_mime.so"
LoadModule rewrite_module    "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/modules/mod_rewrite.so"
LoadModule headers_module    "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/modules/mod_headers.so"
LoadModule env_module        "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/modules/mod_env.so"
LoadModule expires_module    "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/modules/mod_expires.so"
LoadModule deflate_module    "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/modules/mod_deflate.so"
LoadModule php_module        "D:/SMAKZIE/PRODUKTIF/XAMPP/php/php8apache2_4.dll"

<IfModule php_module>
    AddHandler application/x-httpd-php .php
    PHPIniDir "D:/SMAKZIE/PRODUKTIF/XAMPP/php"
</IfModule>

TypesConfig "D:/SMAKZIE/PRODUKTIF/XAMPP/apache/conf/mime.types"
DirectoryIndex index.php index.html

# [2/2] Letak proyek
DocumentRoot "D:/Codingan/Instagi/V3 PHP Native"
<Directory "D:/Codingan/Instagi/V3 PHP Native">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Database UJI — jangan diarahkan ke database produksi.
SetEnv INSTAGI_DB_HOST 127.0.0.1
SetEnv INSTAGI_DB_USER root
SetEnv INSTAGI_DB_PASS ""
SetEnv INSTAGI_DB_NAME instagi_v3_uji
SetEnv INSTAGI_DB_PORT 3306
SetEnv INSTAGI_ADMIN_USER admin_uji
SetEnv INSTAGI_ADMIN_HASH "<hash bcrypt password admin uji>"

ErrorLog "logs/apache-uji-error.log"
LogLevel warn
